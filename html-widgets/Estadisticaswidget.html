    function calcularPeriodos(preset) {
      const hoy = new Date();

      switch (preset) {
        case 'anio': {
          const a0 = new Date(hoy.getFullYear(), 0, 1);
          const b0 = new Date(hoy.getFullYear() - 1, 0, 1);
          const b1 = new Date(hoy.getFullYear() - 1, hoy.getMonth(), hoy.getDate());
          return {
            a: { fechaDesde: toISODate(a0), fechaHasta: toISODate(hoy), label: String(hoy.getFullYear()) },
            b: { fechaDesde: toISODate(b0), fechaHasta: toISODate(b1), label: String(hoy.getFullYear() - 1) }
          };
        }
        case 'trimestre': {
          const q = Math.floor(hoy.getMonth() / 3);
          const qStart = new Date(hoy.getFullYear(), q * 3, 1);
          const qEnd = new Date(hoy.getFullYear(), (q + 1) * 3, 0);
          const qEndActual = qEnd > hoy ? hoy : qEnd;
          const bEnd = new Date(hoy.getFullYear() - 1, hoy.getMonth(), hoy.getDate());
          return {
            a: { fechaDesde: toISODate(qStart), fechaHasta: toISODate(qEndActual), label: `Q${q + 1} ${hoy.getFullYear()}` },
            b: { fechaDesde: toISODate(new Date(hoy.getFullYear() - 1, q * 3, 1)), fechaHasta: toISODate(bEnd), label: `Q${q + 1} ${hoy.getFullYear() - 1}` }
          };
        }
        case 'mes': {
          const m0 = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
          return {
            a: { fechaDesde: toISODate(m0), fechaHasta: toISODate(hoy), label: `${hoy.toLocaleString('es-ES', { month: 'long' })} ${hoy.getFullYear()}` },
            b: { fechaDesde: toISODate(new Date(hoy.getFullYear() - 1, hoy.getMonth(), 1)), fechaHasta: toISODate(new Date(hoy.getFullYear() - 1, hoy.getMonth(), hoy.getDate())), label: `${hoy.toLocaleString('es-ES', { month: 'long' })} ${hoy.getFullYear() - 1}` }
          };
        }
        case 'mesAnterior': {
          const m0 = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
          const mPrev0 = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
          const mPrev1 = new Date(hoy.getFullYear(), hoy.getMonth(), 0);
          return {
            a: { fechaDesde: toISODate(m0), fechaHasta: toISODate(hoy), label: `${hoy.toLocaleString('es-ES', { month: 'long' })} ${hoy.getFullYear()}` },
            b: { fechaDesde: toISODate(mPrev0), fechaHasta: toISODate(mPrev1), label: `${mPrev0.toLocaleString('es-ES', { month: 'long', year: 'numeric' })}` }
          };
        }
        case 'semana': {
          // Semana natural: LUNES a SÁBADO (6 días, sin domingo)
          const dow = hoy.getDay(); // 0=Dom, 1=Lun ... 6=Sáb
          const lunes = new Date(hoy);
          // Calcular lunes de esta semana
          const diffLunes = dow === 0 ? -6 : 1 - dow;
          lunes.setDate(hoy.getDate() + diffLunes);
          const sabado = new Date(lunes);
          sabado.setDate(lunes.getDate() + 5); // Lun+5 = Sáb
          // Semana anterior completa
          const prevLunes = new Date(lunes);
          prevLunes.setDate(lunes.getDate() - 7);
          const prevSabado = new Date(prevLunes);
          prevSabado.setDate(prevLunes.getDate() + 5);
          return {
            a: { fechaDesde: toISODate(lunes), fechaHasta: toISODate(sabado), label: 'Esta semana (L-S)' },
            b: { fechaDesde: toISODate(prevLunes), fechaHasta: toISODate(prevSabado), label: 'Semana anterior (L-S)' }
          };
        }
        default: return null;
      }
    }

    function aplicarCustom() {
      const desdeA = document.getElementById('fechaDesdeA2').value;
      const hastaA = document.getElementById('fechaHastaA2').value;
      const desdeB = document.getElementById('fechaDesdeB').value;
      const hastaB = document.getElementById('fechaHastaB').value;
      if (!desdeA || !hastaA || !desdeB || !hastaB) { alert('Selecciona las 4 fechas'); return; }
      // Actualizar date pickers principales con periodo A
      document.getElementById('fechaDesde').value = desdeA;
      document.getElementById('fechaHasta').value = hastaA;
      requestComparativa({ fechaDesde: desdeB, fechaHasta: hastaB, label: `${desdeB} — ${hastaB}` }, `${desdeA}/${hastaA} vs ${desdeB}/${hastaB}`);
    }

    function requestComparativa(periodoB, presetLabel) {
      const desdeA = document.getElementById('fechaDesde').value;
      const hastaA = document.getElementById('fechaHasta').value;
      _lastPreset = periodoB;
      _lastPresetLabel = presetLabel;

      document.getElementById('graficos').innerHTML = '<div class="loading">Cargando comparativa</div>';
      document.getElementById('tablaContainer').style.display = 'none';
      document.getElementById('seccionNuevas').style.display = 'none';

      window.parent.postMessage({
        type: 'loadComparativa',
        periodoA: { fechaDesde: desdeA, fechaHasta: hastaA, label: `${desdeA} — ${hastaA}` },
        periodoB: { fechaDesde: periodoB.fechaDesde, fechaHasta: periodoB.fechaHasta, label: periodoB.label }
      }, '*');
    }

    function renderComparativa(msg) {
      _comparativaActivo = true;
      _periodoAData = msg.periodoA;
      _periodoBData = msg.periodoB;
      _labelA = msg.labelA || 'Actual';
      _labelB = msg.labelB || 'Anterior';

      showComparativaInfo(_labelA, _labelB);

      // Render period A data normally, then overlay deltas
      _lastData = msg.periodoA;
      renderStats(msg.periodoA);

      // After renderStats, overlay deltas on KPIs
      const a = msg.periodoA;
      const b = msg.periodoB;

      if (a.hayDatos) {
        const ventasA = a.totalVentas != null ? a.totalVentas : a.totalIngresos;
        const ventasB = b.hayDatos ? (b.totalVentas != null ? b.totalVentas : b.totalIngresos) : null;
        const promA = a.totalTransacciones > 0 ? ventasA / a.totalTransacciones : 0;
        const promB = b.hayDatos && b.totalTransacciones > 0 ? ventasB / b.totalTransacciones : 0;
        renderDelta('deltaIngresos', ventasA, ventasB, eur);
        renderDelta('deltaTransacciones', a.totalTransacciones, b.hayDatos ? b.totalTransacciones : null, v => String(v));
        renderDelta('deltaTicket', promA, b.hayDatos ? promB : null, eur);
        renderDelta('deltaImpuesto', a.totalImpuesto || 0, b.hayDatos ? (b.totalImpuesto || 0) : null, eur);
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER STATS (single period + IVA)
    // ═══════════════════════════════════════════════════════════════════════

    function renderStats(data) {
      if (!data.ok) { showError(data.error || 'Error obteniendo datos'); return; }

      if (!data.hayDatos) {
        document.getElementById('graficos').innerHTML = '<div class="no-datos">No hay datos en el período seleccionado</div>';
        document.getElementById('totalIngresos').textContent = '0€';
        document.getElementById('totalTransacciones').textContent = '0';
        document.getElementById('promedioTicket').textContent = '0€';
        document.getElementById('totalImpuesto').textContent = '0€';
        document.getElementById('etiquetaImpuesto').textContent = 'Impuesto';
        document.getElementById('tablaContainer').style.display = 'none';
        document.getElementById('seccionNuevas').style.display = 'none';
        if (!_comparativaActivo) { document.querySelectorAll('.delta').forEach(d => d.classList.remove('visible')); }
        return;
      }

      _lastData = data;
      const vr = data.vatRate || 21;

      // KPIs — v2.5.1: totalVentas (sin propinas)
      const totalVentas = data.totalVentas != null ? data.totalVentas : data.totalIngresos;
      document.getElementById('totalIngresos').textContent = totalVentas.toFixed(2) + '€';
      document.getElementById('totalTransacciones').textContent = data.totalTransacciones;
      const promedio = data.totalTransacciones > 0 ? (totalVentas / data.totalTransacciones) : 0;
      document.getElementById('promedioTicket').textContent = promedio.toFixed(2) + '€';
      // v2.5: IVA KPI
      document.getElementById('totalImpuesto').textContent = (data.totalImpuesto || 0).toFixed(2) + '€';
      document.getElementById('etiquetaImpuesto').textContent = `Impuesto (${vr}%)`;

      // Charts — v2.5.1: en comparativa, pares lado a lado dentro del mismo contenedor
      const compB = _comparativaActivo && _periodoBData && _periodoBData.hayDatos;
      let chartsHTML = `
        <div class="grafico-container" style="grid-column: 1 / -1;">
          <h3>📈 Ingresos por Día</h3>
          <div class="grafico-wrapper"><canvas id="chartIngresos"></canvas></div>
          <div id="ordenIngresosBar" style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;">
            <span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;">Ordenar por</span>
            <button type="button" data-orden="dia" class="btn-orden">Día</button>
            <button type="button" data-orden="importe" class="btn-orden">Importe</button>
          </div>
          <div class="chart-data-table" id="dataIngresos"></div>
        </div>
        <div class="grafico-container"${compB ? ' style="grid-column: 1 / -1;"' : ''}>
          <h3>💳 Importes reales por canal</h3>
          <div class="${compB ? 'compar-pair' : ''}">
            <div>
              ${compB ? '<h4 style="color:var(--text-secondary);">' + _labelA + '</h4>' : ''}
              <div class="grafico-wrapper"><canvas id="chartMetodo"></canvas></div>
              <div class="chart-data-table" id="dataMetodo"></div>
            </div>
            ${compB ? '<div><h4 style="color:#6B5B95;">' + _labelB + '</h4><div class="grafico-wrapper"><canvas id="chartMetodoB"></canvas></div><div class="chart-data-table" id="dataMetodoB"></div></div>' : ''}
          </div>
        </div>
        <div class="grafico-container">
          <h3>🔢 Cobros por botón pulsado</h3>
          <div class="chart-data-table" id="dataBoton"></div>
        </div>
        <div class="grafico-container"${compB ? ' style="grid-column: 1 / -1;"' : ''}>
          <h3>👤 Por Staff</h3>
          <div class="${compB ? 'compar-pair' : ''}">
            <div>
              ${compB ? '<h4 style="color:var(--text-secondary);">' + _labelA + '</h4>' : ''}
              <div class="grafico-wrapper"><canvas id="chartStaff"></canvas></div>
              <div class="chart-data-table" id="dataStaff"></div>
            </div>
            ${compB ? '<div><h4 style="color:#6B5B95;">' + _labelB + '</h4><div class="grafico-wrapper"><canvas id="chartStaffB"></canvas></div><div class="chart-data-table" id="dataStaffB"></div></div>' : ''}
          </div>
        </div>
        <div class="grafico-container" style="grid-column: 1 / -1;">
          <h3>✂️ Top Servicios</h3>
          <div class="grafico-wrapper"><canvas id="chartServicios"></canvas></div>
          <div class="chart-data-table" id="dataServicios"></div>
        </div>
      `;
      document.getElementById('graficos').innerHTML = chartsHTML;

      if (chartIngresos) chartIngresos.destroy();
      if (chartMetodo) chartMetodo.destroy();
      if (chartStaff) chartStaff.destroy();
      if (chartServicios) chartServicios.destroy();

      // Chart 1: Ingresos por día (con overlay en comparativa)
      const ingDatasets = [{ label: 'Ingresos (€)', data: data.ingresosPorDia.valores, borderColor: COLORES.primario, backgroundColor: 'rgba(58,124,165,0.1)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: COLORES.primario }];
      if (compB && _periodoBData.ingresosPorDia) {
        ingDatasets.push({ label: _labelB + ' (€)', data: _periodoBData.ingresosPorDia.valores, borderColor: COLORES.comparB, backgroundColor: 'rgba(107,91,149,0.05)', fill: false, tension: 0.3, pointRadius: 3, borderDash: [5, 5] });
      }
      chartIngresos = new Chart(document.getElementById('chartIngresos'), {
        type: 'line', data: { labels: data.ingresosPorDia.labels, datasets: ingDatasets },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: compB } }, scales: { y: { beginAtZero: true, ticks: { callback: v => v + '€' } } } }
      });

      // Chart 2: Método de pago — Periodo A
      const makeColoresMetodo = (labels) => labels.map(label => {
        if (label.toLowerCase().includes('efectivo')) return COLORES.efectivo;
        if (label.toLowerCase().includes('tarjeta')) return COLORES.tarjeta;
        if (label.toLowerCase().includes('bizum')) return COLORES.bizum;
        return COLORES.gradiente[3];
      });
      const coloresMetodo = makeColoresMetodo(data.porMetodoPago.labels);
      chartMetodo = new Chart(document.getElementById('chartMetodo'), {
        type: 'doughnut', data: { labels: data.porMetodoPago.labels, datasets: [{ data: data.porMetodoPago.valores, backgroundColor: coloresMetodo, borderWidth: 2, borderColor: '#fff' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 15, padding: 15 } }, tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw.toFixed(2)}€` } } } }
      });
      // Periodo B
      if (compB && _periodoBData.porMetodoPago) {
        const colB = makeColoresMetodo(_periodoBData.porMetodoPago.labels);
        new Chart(document.getElementById('chartMetodoB'), {
          type: 'doughnut', data: { labels: _periodoBData.porMetodoPago.labels, datasets: [{ data: _periodoBData.porMetodoPago.valores, backgroundColor: colB, borderWidth: 2, borderColor: '#fff' }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 15, padding: 15 } }, tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw.toFixed(2)}€` } } } }
        });
        // Tabla Método B
        const totalMetB = _periodoBData.porMetodoPago.valores.reduce((s, v) => s + v, 0);
        let hMetB = '<table><thead><tr><th>Método</th><th>Importe</th><th>%</th></tr></thead><tbody>';
        for (let i = 0; i < _periodoBData.porMetodoPago.labels.length; i++) {
          const v = _periodoBData.porMetodoPago.valores[i];
          hMetB += `<tr><td>${_periodoBData.porMetodoPago.labels[i]}</td><td>${eur(v)}</td><td>${pct(totalMetB > 0 ? v/totalMetB*100 : 0)}</td></tr>`;
        }
        hMetB += `<tr class="total-row"><td>Total</td><td>${eur(totalMetB)}</td><td></td></tr></tbody></table>`;
        document.getElementById('dataMetodoB').innerHTML = hMetB;
      }

      // Chart 3: Staff — Periodo A
      chartStaff = new Chart(document.getElementById('chartStaff'), {
        type: 'bar', data: { labels: data.porStaff.labels, datasets: [{ label: 'Ingresos (€)', data: data.porStaff.valores, backgroundColor: COLORES.gradiente.slice(0, data.porStaff.labels.length), borderRadius: 6 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { callback: v => v + '€' } } } }
      });
      // Periodo B
      if (compB && _periodoBData.porStaff) {
        new Chart(document.getElementById('chartStaffB'), {
          type: 'bar', data: { labels: _periodoBData.porStaff.labels, datasets: [{ label: 'Ingresos (€)', data: _periodoBData.porStaff.valores, backgroundColor: COLORES.gradiente.slice(0, _periodoBData.porStaff.labels.length), borderRadius: 6 }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { callback: v => v + '€' } } } }
        });
        // Tabla Staff B
        const totalStB = _periodoBData.porStaff.valores.reduce((s, v) => s + v, 0);
        let hStB = '<table><thead><tr><th>Staff</th><th>Ingresos</th><th>%</th></tr></thead><tbody>';
        for (let i = 0; i < _periodoBData.porStaff.labels.length; i++) {
          const v = _periodoBData.porStaff.valores[i];
          hStB += `<tr><td>${_periodoBData.porStaff.labels[i]}</td><td>${eur(v)}</td><td>${pct(totalStB > 0 ? v/totalStB*100 : 0)}</td></tr>`;
        }
        hStB += `<tr class="total-row"><td>Total</td><td>${eur(totalStB)}</td><td></td></tr></tbody></table>`;
        document.getElementById('dataStaffB').innerHTML = hStB;
      }

      // Chart 4: Top servicios
      chartServicios = new Chart(document.getElementById('chartServicios'), {
        type: 'bar', data: { labels: data.porServicio.labels, datasets: [{ label: 'Ingresos (€)', data: data.porServicio.valores, backgroundColor: COLORES.secundario, borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { callback: v => v + '€' } }, x: { ticks: { maxRotation: 45, minRotation: 45 } } } }
      });

      // ═══════════════════════════════════════════════════════════════════
      // DATA TABLES UNDER CHARTS — v2.5: con IVA donde aplica
      // ═══════════════════════════════════════════════════════════════════

      // v2.6.0: Ingresos por día — orden seleccionable (Día / Importe)
      renderTablaIngresosDia();

      // Método de pago — SIN IVA
      {
        let h = '<table><thead><tr><th>Método</th><th>Importe</th><th>%</th></tr></thead><tbody>';
        const totalMet = data.porMetodoPago.valores.reduce((s, v) => s + v, 0);
        for (let i = 0; i < data.porMetodoPago.labels.length; i++) {
          const v = data.porMetodoPago.valores[i];
          const p = totalMet > 0 ? (v / totalMet * 100) : 0;
          h += `<tr><td>${data.porMetodoPago.labels[i]}</td><td>${eur(v)}</td><td>${pct(p)}</td></tr>`;
        }
        h += `<tr class="total-row"><td>Total</td><td>${eur(totalMet)}</td><td></td></tr></tbody></table>`;
        h += `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.45;">Los cobros mixtos están repartidos: cada canal incluye su parte. Tarjeta = tarjeta pura + parte tarjeta de los mixtos, e igual con efectivo y bizum. Es lo que debe cuadrar con el datáfono, el cajón y el extracto.</div>`;
        document.getElementById('dataMetodo').innerHTML = h;
      }

      // v2.6.2 — Cobros por botón pulsado + canjes de bono.
      // Vista de AUDITORÍA, paralela a la de canales: cuenta pulsaciones,
      // no dinero por canal. Por eso 'Mixto' es una fila propia — fue UN
      // botón — y no se reparte. El TOTAL coincide con el de arriba;
      // las cifras por fila no tienen por qué, y eso no es un descuadre.
      {
        const cont = document.getElementById('dataBoton');
        const filas = Array.isArray(data.porBotonPago) ? data.porBotonPago : null;
        if (!cont) {
          // nada que pintar
        } else if (!filas || !filas.length) {
          cont.innerHTML = '<div style="font-size:12px;color:var(--text-secondary);padding:6px 0;">Sin cobros registrados en el periodo.</div>';
        } else {
          const ICO = { 'Tarjeta': '💳', 'Efectivo': '💵', 'Bizum': '📲', 'Mixto': '🔀', 'Canje': '🎟️' };
          const tot = data.botonTotales || {
            n: filas.reduce((a, b) => a + b.n, 0),
            importe: filas.reduce((a, b) => a + b.importe, 0)
          };
          let h = '<table><thead><tr><th>Botón</th><th>Nº cobros</th><th>Importe</th><th>%</th></tr></thead><tbody>';
          for (const f of filas) {
            const pc = tot.importe > 0 ? (f.importe / tot.importe * 100) : 0;
            const ico = ICO[f.metodo] || '⚠️';
            h += `<tr><td>${ico} ${f.metodo}</td><td>${f.n}</td><td>${eur(f.importe)}</td><td>${pct(pc)}</td></tr>`;
          }
          h += `<tr class="total-row"><td>Total</td><td>${tot.n}</td><td>${eur(tot.importe)}</td><td></td></tr></tbody></table>`;
          h += `<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.45;">Cuántas veces se pulsó cada botón de cobro. Un cobro mixto cuenta como UNA pulsación de Mixto y su importe no se reparte: para ver dónde acabó ese dinero, mira el bloque de canales.</div>`;

          const cb = data.canjesBono;
          if (cb && cb.disponible && cb.n > 0) {
            h += `<div style="margin-top:14px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;">
              <div style="font-size:12px;font-weight:700;color:var(--text-secondary);letter-spacing:.4px;margin-bottom:6px;">🎟️ CANJES DE BONO</div>
              <div style="font-size:13px;"><b>${cb.n}</b> ${cb.n === 1 ? 'canje' : 'canjes'} · <b>${eur(cb.valorConsumido)}</b> de valor de tarifa consumido</div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:5px;line-height:1.45;">No es caja nueva: ese dinero entró el día que el cliente compró el bono. Por eso no suma a las ventas ni a ningún canal de cobro.</div>
            </div>`;
          }
          cont.innerHTML = h;
        }
      }

      // Staff — SIN IVA
      {
        let h = '<table><thead><tr><th>Staff</th><th>Ingresos</th><th>%</th></tr></thead><tbody>';
        const totalSt = data.porStaff.valores.reduce((s, v) => s + v, 0);
        for (let i = 0; i < data.porStaff.labels.length; i++) {
          const v = data.porStaff.valores[i];
          const p = totalSt > 0 ? (v / totalSt * 100) : 0;
          h += `<tr><td>${data.porStaff.labels[i]}</td><td>${eur(v)}</td><td>${pct(p)}</td></tr>`;
        }
        h += `<tr class="total-row"><td>Total</td><td>${eur(totalSt)}</td><td></td></tr></tbody></table>`;
        document.getElementById('dataStaff').innerHTML = h;
      }

      // Top servicios — CON IVA
      {
        const hasIVA = data.porServicio.valoresBase && data.porServicio.valoresIva;
        let h = '<table><thead><tr><th>Servicio</th><th>Total</th>';
        if (hasIVA) h += '<th class="col-base">Base</th><th class="col-iva">IVA</th>';
        h += '<th>%</th></tr></thead><tbody>';
        const totalSvc = data.porServicio.valores.reduce((s, v) => s + v, 0);
        for (let i = 0; i < data.porServicio.labels.length; i++) {
          const v = data.porServicio.valores[i];
          const p = totalSvc > 0 ? (v / totalSvc * 100) : 0;
          h += `<tr><td>${data.porServicio.labels[i]}</td><td>${eur(v)}</td>`;
          if (hasIVA) h += `<td class="col-base">${eur(data.porServicio.valoresBase[i])}</td><td class="col-iva">${eur(data.porServicio.valoresIva[i])}</td>`;
          h += `<td>${pct(p)}</td></tr>`;
        }
        h += `<tr class="total-row"><td>Top 10</td><td>${eur(totalSvc)}</td>`;
        if (hasIVA) {
          const tBase = data.porServicio.valoresBase.reduce((s, v) => s + v, 0);
          const tIva = data.porServicio.valoresIva.reduce((s, v) => s + v, 0);
          h += `<td class="col-base">${eur(tBase)}</td><td class="col-iva">${eur(tIva)}</td>`;
        }
        h += '<td></td></tr></tbody></table>';
        document.getElementById('dataServicios').innerHTML = h;
      }

      renderTablaDesglose(data);
      renderNuevasSecciones(data);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // v2.6.0 — TABLA INGRESOS POR DÍA CON ORDEN SELECCIONABLE
    //   'dia'     → data.ingresosPorDia        (cronológico, por defecto)
    //   'importe' → data.ingresosPorDiaRanking (mayor a menor)
    //   El gráfico NO cambia: siempre cronológico.
    // ═══════════════════════════════════════════════════════════════════════

    function getDatosIngresosDia() {
      if (!_lastData) return null;
      if (_ordenIngresosDia === 'importe') {
        return _lastData.ingresosPorDiaRanking || _lastData.ingresosPorDia;
      }
      return _lastData.ingresosPorDia;
    }

    function pintarBotonesOrden() {
      const bar = document.getElementById('ordenIngresosBar');
      if (!bar) return;
      bar.querySelectorAll('.btn-orden').forEach(btn => {
        const activo = btn.dataset.orden === _ordenIngresosDia;
        btn.style.padding = '5px 14px';
        btn.style.borderRadius = 'var(--radius-sm)';
        btn.style.cursor = 'pointer';
        btn.style.fontFamily = 'inherit';
        btn.style.fontSize = '12px';
        btn.style.fontWeight = '600';
        btn.style.border = '1px solid ' + (activo ? 'var(--accent)' : 'var(--border)');
        btn.style.background = activo ? 'var(--accent)' : 'var(--surface2)';
        btn.style.color = activo ? '#fff' : 'var(--text-secondary)';
      });
    }

    function renderTablaIngresosDia() {
      const cont = document.getElementById('dataIngresos');
      if (!cont || !_lastData) return;

      const rankData = getDatosIngresosDia();
      if (!rankData) return;

      const hasIVA = rankData.valoresBase && rankData.valoresIva;
      const hasDS = rankData.diasSemana && rankData.promediosDiaSemana;

      let h = '<table><thead><tr><th>Día</th>';
      if (hasDS) h += '<th></th>';
      h += '<th>Total</th>';
      if (hasDS) h += '<th>Media día</th><th>vs Media</th>';
      if (hasIVA) h += '<th class="col-base">Base</th><th class="col-iva">IVA</th>';
      h += '</tr></thead><tbody>';

      let totalIng = 0, totalBase = 0, totalIva = 0;
      for (let i = 0; i < rankData.labels.length; i++) {
        const v = rankData.valores[i];
        totalIng += v;
        h += `<tr><td>${rankData.labels[i]}</td>`;
        if (hasDS) {
          const avg = rankData.promediosDiaSemana[i];
          h += `<td style="color:var(--muted)">${rankData.diasSemana[i].substring(0,3)}</td>`;
          h += `<td>${eur(v)}</td>`;
          h += `<td style="color:var(--muted)">${eur(avg)}</td>`;
          if (v === 0 || avg <= 0) {
            // Día sin cobros (salón cerrado): un -100% no aporta información.
            h += '<td style="color:var(--muted)">—</td>';
          } else {
            const delta = Math.round((v - avg) / avg * 10000) / 100;
            const cls = delta >= 0 ? 'color:var(--delta-up)' : 'color:var(--delta-down)';
            const arrow = delta >= 0 ? '▲' : '▼';
            h += `<td style="${cls};font-weight:600">${arrow} ${delta >= 0 ? '+' : ''}${delta.toFixed(1)}%</td>`;
          }
        } else {
          h += `<td>${eur(v)}</td>`;
        }
        if (hasIVA) {
          totalBase += rankData.valoresBase[i];
          totalIva += rankData.valoresIva[i];
          h += `<td class="col-base">${eur(rankData.valoresBase[i])}</td><td class="col-iva">${eur(rankData.valoresIva[i])}</td>`;
        }
        h += '</tr>';
      }

      h += '<tr class="total-row"><td>Total</td>';
      if (hasDS) h += '<td></td>';
      h += `<td>${eur(totalIng)}</td>`;
      if (hasDS) h += '<td></td><td></td>';
      if (hasIVA) h += `<td class="col-base">${eur(totalBase)}</td><td class="col-iva">${eur(totalIva)}</td>`;
      h += '</tr></tbody></table>';

      cont.innerHTML = h;

      // Botones de orden: se repintan y se reenganchan en cada render porque
      // el contenedor de gráficos se regenera entero con innerHTML.
      const bar = document.getElementById('ordenIngresosBar');
      if (bar) {
        bar.querySelectorAll('.btn-orden').forEach(btn => {
          btn.onclick = () => {
            _ordenIngresosDia = btn.dataset.orden;
            renderTablaIngresosDia();
          };
        });
        pintarBotonesOrden();
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER TABLA DESGLOSE — v2.5: con IVA
    // ═══════════════════════════════════════════════════════════════════════

    function renderTablaDesglose(data) {
      const container = document.getElementById('tablaContainer');
      const tabla = document.getElementById('tablaDesglose');
      const periodo = document.getElementById('tablaPeriodo');

      const fechaDesde = document.getElementById('fechaDesde').value;
      const fechaHasta = document.getElementById('fechaHasta').value;
      const d1 = new Date(fechaDesde), d2 = new Date(fechaHasta);
      const dias = Math.round((d2 - d1) / 86400000) + 1;
      const semanas = (dias / 7).toFixed(1);
      periodo.textContent = `Desde: ${d1.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} — Hasta: ${d2.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} · ${dias} días (${semanas} semanas)`;

      // v2.5: Check if IVA data available
      const hasIVA = data.tablaDesglose && data.tablaDesglose.length > 0 && data.tablaDesglose[0].totalImporteBase != null;
      const colSpan = hasIVA ? 8 : 6;

      let grandCant = 0, grandImporte = 0, grandBase = 0, grandIva = 0;
      if (data.tablaDesglose) {
        for (const cat of data.tablaDesglose) {
          grandCant += cat.totalCantidad;
          grandImporte += cat.totalImporte;
          if (hasIVA) { grandBase += cat.totalImporteBase || 0; grandIva += cat.totalImporteIva || 0; }
        }
      }
      let prodCant = 0, prodImporte = 0;
      if (data.productos && data.productos.desglose) {
        for (const p of data.productos.desglose) { prodCant += p.count; prodImporte += p.total; }
        grandCant += prodCant; grandImporte += prodImporte;
      }
      let extCant = 0, extImporte = 0;
      if (data.externos && data.externos.desglose) {
        for (const e of data.externos.desglose) { extCant += e.count; extImporte += e.comision; }
        grandCant += extCant; grandImporte += extImporte;
      }

      let html = '<thead><tr>';
      html += '<th style="min-width:200px;"></th><th>Cant.</th><th>€</th>';
      if (hasIVA) html += '<th class="col-base">Base</th><th class="col-iva">IVA</th>';
      html += '<th>1/2. €</th><th>% de €</th><th>% Cant.</th>';
      html += '</tr></thead><tbody>';

      if (data.tablaDesglose) {
        for (const cat of data.tablaDesglose) {
          const cssClass = cat.categoria === 'EXTRAS' ? ' extras' : cat.categoria === 'PROPINAS' ? ' extras' : '';
          html += `<tr class="cat-header${cssClass}"><td colspan="${colSpan}">${cat.categoria}</td></tr>`;

          let currentSubgrupo = '__none__';
          for (const item of cat.items) {
            if ((item.subgrupo || null) !== (currentSubgrupo === '__none__' ? null : currentSubgrupo)) {
              currentSubgrupo = item.subgrupo || null;
              if (currentSubgrupo) {
                html += `<tr class="subgrupo-header"><td colspan="${colSpan}">${currentSubgrupo}</td></tr>`;
              }
            }
            html += '<tr class="svc-row">';
            html += `<td>${item.nombre}</td><td>${item.cantidad}</td><td>${eur(item.importe)}</td>`;
            if (hasIVA) html += `<td class="col-base">${eur(item.importeBase)}</td><td class="col-iva">${eur(item.importeIva)}</td>`;
            html += `<td>${eur(item.ticketMedio)}</td>`;
            html += `<td>${pct(grandImporte > 0 ? (item.importe / grandImporte * 100) : 0)}</td>`;
            html += `<td>${pct(grandCant > 0 ? (item.cantidad / grandCant * 100) : 0)}</td>`;
            html += '</tr>';
          }

          const catTicket = cat.totalCantidad > 0 ? cat.totalImporte / cat.totalCantidad : 0;
          html += `<tr class="cat-subtotal${cssClass}"><td></td><td>${cat.totalCantidad}</td><td>${eur(cat.totalImporte)}</td>`;
          if (hasIVA) html += `<td class="col-base">${eur(cat.totalImporteBase)}</td><td class="col-iva">${eur(cat.totalImporteIva)}</td>`;
          html += `<td>${eur(catTicket)}</td>`;
          html += `<td>${pct(grandImporte > 0 ? (cat.totalImporte / grandImporte * 100) : 0)}</td>`;
          html += `<td>${pct(grandCant > 0 ? (cat.totalCantidad / grandCant * 100) : 0)}</td></tr>`;
        }
      }

      // Productos (sin IVA desglosado)
      if (data.productos && data.productos.desglose && data.productos.desglose.length > 0) {
        html += `<tr class="cat-header productos"><td colspan="${colSpan}">PRODUCTOS</td></tr>`;
        for (const p of data.productos.desglose) {
          const ticket = p.count > 0 ? p.total / p.count : 0;
          html += '<tr class="svc-row">';
          html += `<td>🛒 ${p.nombre}</td><td>${p.count}</td><td>${eur(p.total)}</td>`;
          if (hasIVA) html += '<td></td><td></td>';
          html += `<td>${eur(ticket)}</td>`;
          html += `<td>${pct(grandImporte > 0 ? (p.total / grandImporte * 100) : 0)}</td>`;
          html += `<td>${pct(grandCant > 0 ? (p.count / grandCant * 100) : 0)}</td></tr>`;
        }
        const prodTicket = prodCant > 0 ? prodImporte / prodCant : 0;
        html += `<tr class="cat-subtotal productos"><td></td><td>${prodCant}</td><td>${eur(prodImporte)}</td>`;
        if (hasIVA) html += '<td></td><td></td>';
        html += `<td>${eur(prodTicket)}</td>`;
        html += `<td>${pct(grandImporte > 0 ? (prodImporte / grandImporte * 100) : 0)}</td>`;
        html += `<td>${pct(grandCant > 0 ? (prodCant / grandCant * 100) : 0)}</td></tr>`;
      }

      // Externos (sin IVA desglosado)
      if (data.externos && data.externos.desglose && data.externos.desglose.length > 0) {
        html += `<tr class="cat-header externos"><td colspan="${colSpan}">COMISIONES EXTERNAS</td></tr>`;
        for (const e of data.externos.desglose) {
          const ticket = e.count > 0 ? e.comision / e.count : 0;
          html += '<tr class="svc-row">';
          html += `<td>🔗 ${e.nombre}</td><td>${e.count}</td><td>${eur(e.comision)}</td>`;
          if (hasIVA) html += '<td></td><td></td>';
          html += `<td>${eur(ticket)}</td>`;
          html += `<td>${pct(grandImporte > 0 ? (e.comision / grandImporte * 100) : 0)}</td>`;
          html += `<td>${pct(grandCant > 0 ? (e.count / grandCant * 100) : 0)}</td></tr>`;
        }
        const extTicket = extCant > 0 ? extImporte / extCant : 0;
        html += `<tr class="cat-subtotal externos"><td></td><td>${extCant}</td><td>${eur(extImporte)}</td>`;
        if (hasIVA) html += '<td></td><td></td>';
        html += `<td>${eur(extTicket)}</td>`;
        html += `<td>${pct(grandImporte > 0 ? (extImporte / grandImporte * 100) : 0)}</td>`;
        html += `<td>${pct(grandCant > 0 ? (extCant / grandCant * 100) : 0)}</td></tr>`;
      }

      // Gran total
      const grandTicket = grandCant > 0 ? grandImporte / grandCant : 0;
      html += '<tr class="grand-total">';
      html += `<td>Total de todas las Categorías</td><td>${grandCant}</td><td>${eur(grandImporte)}</td>`;
      if (hasIVA) html += `<td class="col-base">${eur(grandBase)}</td><td class="col-iva">${eur(grandIva)}</td>`;
      html += `<td>${eur(grandTicket)}</td><td></td><td></td></tr>`;

      html += '</tbody>';
      tabla.innerHTML = html;
      container.style.display = 'block';
    }

    // ═══════════════════════════════════════════════════════════════════════
    // NUEVAS SECCIONES (sin cambios respecto a v2.4)
    // ═══════════════════════════════════════════════════════════════════════

    function renderNuevasSecciones(data) {
      const container = document.getElementById('seccionNuevas');

      let htmlDS = '';
      if (data.porDiaSemana && data.porDiaSemana.labels.length > 0) {
        const hasAvg = data.porDiaSemana.conteos && data.porDiaSemana.promedios;
        htmlDS += '<h3>Ingresos por Dia de la Semana</h3>';
        htmlDS += '<table class="tabla-desglose"><thead><tr><th>Dia</th><th>Total</th>';
        if (hasAvg) htmlDS += '<th>Nº días</th><th>Media/día</th>';
        htmlDS += '<th>%</th></tr></thead><tbody>';
        const totalDS = data.porDiaSemana.valores.reduce((s, v) => s + v, 0);
        for (let i = 0; i < data.porDiaSemana.labels.length; i++) {
          const v = data.porDiaSemana.valores[i];
          const p = totalDS > 0 ? (v / totalDS * 100) : 0;
          htmlDS += `<tr class="svc-row"><td>${data.porDiaSemana.labels[i]}</td><td>${eur(v)}</td>`;
          if (hasAvg) htmlDS += `<td>${data.porDiaSemana.conteos[i]}</td><td>${eur(data.porDiaSemana.promedios[i])}</td>`;
          htmlDS += `<td>${pct(p)}</td></tr>`;
        }
        const totalCont = hasAvg ? data.porDiaSemana.conteos.reduce((s, v) => s + v, 0) : 0;
        htmlDS += `<tr class="grand-total"><td>Total</td><td>${eur(totalDS)}</td>`;
        if (hasAvg) htmlDS += `<td>${totalCont}</td><td></td>`;
        htmlDS += '<td></td></tr></tbody></table>';
      }
      document.getElementById('diaSemanaSection').innerHTML = htmlDS;

      let htmlClientes = '';
      if (data.clientesPorTipo && data.clientesPorTipo.total > 0) {
        const ct = data.clientesPorTipo;
        htmlClientes += '<h3>Clientes por Tipo</h3>';
        htmlClientes += '<table class="tabla-desglose"><thead><tr><th>Tipo</th><th>Cantidad</th><th>%</th></tr></thead><tbody>';
        for (const t of ct.tipos) {
          htmlClientes += `<tr class="svc-row"><td>${t.tipo}</td><td>${t.cantidad}</td><td>${pct(t.pct)}</td></tr>`;
        }
        htmlClientes += `<tr class="grand-total"><td>Total clientes</td><td>${ct.total}</td><td></td></tr></tbody></table>`;
      }
      document.getElementById('clientesSection').innerHTML = htmlClientes;

      let htmlRatio = '';
      if (data.ratioSTvsComplementos) {
        const rst = data.ratioSTvsComplementos;
        htmlRatio += '<h3>Servicios Tecnicos vs Complementos Asociados</h3>';
        htmlRatio += '<table class="tabla-desglose"><tbody>';
        htmlRatio += `<tr class="svc-row"><td style="font-weight:600;">Ingresos Servicios Tecnicos (principal)</td><td>${eur(rst.ingresosST)}</td></tr>`;
        htmlRatio += `<tr class="svc-row"><td style="font-weight:600;">Ingresos complementos asociados a ST</td><td>${eur(rst.ingresosComplementos)}</td></tr>`;
        htmlRatio += `<tr class="svc-row"><td style="font-weight:600;">Ratio complementos / ST</td><td>${pct(rst.ratio)}</td></tr>`;
        htmlRatio += '</tbody></table>';
        if (rst.top5 && rst.top5.length > 0) {
          htmlRatio += '<h4 style="margin-top:12px;font-size:14px;color:#2c3e50;">Top 5 Complementos de Servicios Tecnicos</h4>';
          htmlRatio += '<table class="tabla-desglose"><thead><tr><th>Servicio</th><th>Cant.</th><th>Importe</th></tr></thead><tbody>';
          for (const c of rst.top5) { htmlRatio += `<tr class="svc-row"><td>${c.nombre}</td><td>${c.cantidad}</td><td>${eur(c.importe)}</td></tr>`; }
          htmlRatio += '</tbody></table>';
        }
      }
      document.getElementById('ratioSTSection').innerHTML = htmlRatio;

      let htmlProd = '';
      if (data.productividadStaff && data.productividadStaff.length > 0) {
        htmlProd += '<h3>Productividad por Empleado</h3>';
        htmlProd += '<table class="tabla-desglose"><thead><tr><th>Empleado</th><th>Ingresos</th><th>Horas</th><th>Servicios</th><th>EUR/hora</th><th>Min/servicio</th></tr></thead><tbody>';
        for (const ps of data.productividadStaff) {
          htmlProd += `<tr class="svc-row"><td>${ps.nombre}</td><td>${eur(ps.ingresos)}</td><td>${ps.horas}h</td><td>${ps.servicios}</td><td>${eur(ps.eurosPorHora)}</td><td>${ps.minutosPorServicio} min</td></tr>`;
        }
        htmlProd += '</tbody></table>';
      }
      document.getElementById('productividadSection').innerHTML = htmlProd;

      container.style.display = (htmlDS || htmlClientes || htmlRatio || htmlProd) ? 'block' : 'none';

      // v2.5.1: Scroll a Día de Semana si se pulsó el preset
      if (_scrollToDiaSemana && htmlDS) {
        _scrollToDiaSemana = false;
        setTimeout(() => {
          document.getElementById('diaSemanaSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
      }
    }

    function showError(message) {
      document.getElementById('graficos').innerHTML = `<div class="no-datos">Error: ${message}</div>`;
      document.getElementById('tablaContainer').style.display = 'none';
      document.getElementById('seccionNuevas').style.display = 'none';
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EXPORTAR PDF — v2.5: incluye IVA donde aplica
    // ═══════════════════════════════════════════════════════════════════════

    function exportarPdfConGraficos() {
      const { jsPDF } = window.jspdf;
      if (!_lastData || !_lastData.hayDatos) { alert('Primero carga los datos'); return; }

      const doc = new jsPDF('p', 'mm', 'a4');
      const pw = 210, ph = 297, m = 15;
      const cw = pw - m * 2;
      const fechaDesde = document.getElementById('fechaDesde').value;
      const fechaHasta = document.getElementById('fechaHasta').value;
      const vr = _lastData.vatRate || 21;
      const totalVentas = _lastData.totalVentas != null ? _lastData.totalVentas : _lastData.totalIngresos;
      const promedio = _lastData.totalTransacciones > 0 ? totalVentas / _lastData.totalTransacciones : 0;
      let y = 20;

      const checkPage = (needed) => { if (y + needed > ph - 20) { doc.addPage(); y = 20; } };
      const headStyle = { fillColor: [44, 62, 80], textColor: 255, fontStyle: 'bold', fontSize: 9 };
      const bodyStyle = { fontSize: 9, cellPadding: 3 };

      // ─────────────────────────────────────────────────────
      // TÍTULO + PERIODO
      // ─────────────────────────────────────────────────────
      doc.setFontSize(18); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
      doc.text('Estadísticas y Análisis — Hair Times', m, y); y += 8;
      doc.setFontSize(10); doc.setFont(undefined, 'normal'); doc.setTextColor(100);
      doc.text(`Período: ${fechaDesde} — ${fechaHasta}`, m, y); y += 5;
      if (_comparativaActivo) { doc.setTextColor(107, 91, 149); doc.setFont(undefined, 'bold'); doc.text(`Comparativa: ${_labelA} vs ${_labelB}`, m, y); y += 5; doc.setFont(undefined, 'normal'); }
      doc.setDrawColor(200); doc.line(m, y, pw - m, y); y += 6;

      // ─────────────────────────────────────────────────────
      // KPIs
      // ─────────────────────────────────────────────────────
      doc.autoTable({
        startY: y,
        head: [['Total Ventas', 'Transacciones', 'Ticket Medio', `Impuesto (${vr}%)`]],
        body: [[eur(totalVentas), String(_lastData.totalTransacciones), eur(promedio), eur(_lastData.totalImpuesto || 0)]],
        theme: 'grid',
        styles: { fontSize: 14, halign: 'center', fontStyle: 'bold', cellPadding: 5 },
        headStyles: { fillColor: [44, 62, 80], textColor: 255, fontSize: 9, fontStyle: 'bold' },
        margin: { left: m, right: m },
      });
      y = doc.lastAutoTable.finalY + 10;

      // ─────────────────────────────────────────────────────
      // GRÁFICO: Ingresos por Día + tabla datos
      // ─────────────────────────────────────────────────────
      checkPage(100);
      doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
      doc.text('Ingresos por Día', m, y); y += 4;
      doc.addImage(chartIngresos.toBase64Image(), 'PNG', m, y, cw, 65); y += 70;

      // Tabla Ingresos por Día — v2.6.0: mismo orden que el elegido en pantalla
      {
        const rd = getDatosIngresosDia() || _lastData.ingresosPorDia;
        const hasIVA = rd.valoresBase && rd.valoresIva;
        const head = hasIVA ? [['Día', 'Total', 'Base', 'IVA']] : [['Día', 'Ingresos']];
        const body = [];
        let tV = 0, tB = 0, tI = 0;
        for (let i = 0; i < rd.labels.length; i++) {
          const row = [rd.labels[i], eur(rd.valores[i])];
          if (hasIVA) { row.push(eur(rd.valoresBase[i]), eur(rd.valoresIva[i])); tB += rd.valoresBase[i]; tI += rd.valoresIva[i]; }
          body.push(row); tV += rd.valores[i];
        }
        const totalRow = ['Total', eur(tV)];
        if (hasIVA) totalRow.push(eur(tB), eur(tI));
        body.push(totalRow);

        doc.autoTable({
          startY: y, head, body, theme: 'striped', styles: bodyStyle, headStyles: headStyle,
          margin: { left: m, right: m },
          didParseCell: (data) => { if (data.row.index === body.length - 1) { data.cell.styles.fontStyle = 'bold'; data.cell.styles.fillColor = [230, 230, 230]; } },
          columnStyles: hasIVA ? { 0: { halign: 'left' }, 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } } : { 0: { halign: 'left' }, 1: { halign: 'right' } }
        });
        y = doc.lastAutoTable.finalY + 10;
      }

      // ─────────────────────────────────────────────────────
      // GRÁFICO: Método de Pago + tabla
      // ─────────────────────────────────────────────────────
      checkPage(100);
      doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
      doc.text('Por Método de Pago', m, y); y += 4;
      doc.addImage(chartMetodo.toBase64Image(), 'PNG', m, y, cw, 65); y += 70;

      {
        const totalMet = _lastData.porMetodoPago.valores.reduce((s, v) => s + v, 0);
        const body = _lastData.porMetodoPago.labels.map((l, i) => {
          const v = _lastData.porMetodoPago.valores[i];
          return [l, eur(v), pct(totalMet > 0 ? v / totalMet * 100 : 0)];
        });
        body.push(['Total', eur(totalMet), '']);
        doc.autoTable({
          startY: y, head: [['Método', 'Importe', '%']], body, theme: 'striped', styles: bodyStyle, headStyles: headStyle,
          margin: { left: m, right: m },
          columnStyles: { 0: { halign: 'left' }, 1: { halign: 'right' }, 2: { halign: 'right' } },
          didParseCell: (data) => { if (data.row.index === body.length - 1) { data.cell.styles.fontStyle = 'bold'; data.cell.styles.fillColor = [230, 230, 230]; } }
        });
        y = doc.lastAutoTable.finalY + 10;
      }

      // ─────────────────────────────────────────────────────
      // GRÁFICO: Staff + tabla
      // ─────────────────────────────────────────────────────
      checkPage(100);
      doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
      doc.text('Por Staff', m, y); y += 4;
      doc.addImage(chartStaff.toBase64Image(), 'PNG', m, y, cw, 65); y += 70;

      {
        const totalSt = _lastData.porStaff.valores.reduce((s, v) => s + v, 0);
        const body = _lastData.porStaff.labels.map((l, i) => {
          const v = _lastData.porStaff.valores[i];
          return [l, eur(v), pct(totalSt > 0 ? v / totalSt * 100 : 0)];
        });
        body.push(['Total', eur(totalSt), '']);
        doc.autoTable({
          startY: y, head: [['Staff', 'Ingresos', '%']], body, theme: 'striped', styles: bodyStyle, headStyles: headStyle,
          margin: { left: m, right: m },
          columnStyles: { 0: { halign: 'left' }, 1: { halign: 'right' }, 2: { halign: 'right' } },
          didParseCell: (data) => { if (data.row.index === body.length - 1) { data.cell.styles.fontStyle = 'bold'; data.cell.styles.fillColor = [230, 230, 230]; } }
        });
        y = doc.lastAutoTable.finalY + 10;
      }

      // ─────────────────────────────────────────────────────
      // GRÁFICO: Top Servicios + tabla (con IVA)
      // ─────────────────────────────────────────────────────
      checkPage(100);
      doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
      doc.text('Top Servicios', m, y); y += 4;
      doc.addImage(chartServicios.toBase64Image(), 'PNG', m, y, cw, 65); y += 70;

      {
        const d = _lastData.porServicio;
        const hasIVA = d.valoresBase && d.valoresIva;
        const totalSvc = d.valores.reduce((s, v) => s + v, 0);
        const head = hasIVA ? [['Servicio', 'Total', 'Base', 'IVA', '%']] : [['Servicio', 'Ingresos', '%']];
        const body = d.labels.map((l, i) => {
          const row = [l, eur(d.valores[i])];
          if (hasIVA) row.push(eur(d.valoresBase[i]), eur(d.valoresIva[i]));
          row.push(pct(totalSvc > 0 ? d.valores[i] / totalSvc * 100 : 0));
          return row;
        });
        const totalRow = ['Top 10', eur(totalSvc)];
        if (hasIVA) { totalRow.push(eur(d.valoresBase.reduce((s, v) => s + v, 0)), eur(d.valoresIva.reduce((s, v) => s + v, 0))); }
        totalRow.push('');
        body.push(totalRow);
        doc.autoTable({
          startY: y, head, body, theme: 'striped', styles: bodyStyle, headStyles: headStyle,
          margin: { left: m, right: m },
          didParseCell: (data) => { if (data.row.index === body.length - 1) { data.cell.styles.fontStyle = 'bold'; data.cell.styles.fillColor = [230, 230, 230]; } }
        });
        y = doc.lastAutoTable.finalY + 12;
      }

      // ─────────────────────────────────────────────────────
      // TABLA DESGLOSE POR CATEGORÍA (con IVA)
      // ─────────────────────────────────────────────────────
      if (_lastData.tablaDesglose || (_lastData.productos && _lastData.productos.desglose) || (_lastData.externos && _lastData.externos.desglose)) {
        checkPage(30);
        doc.setFontSize(15); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
        doc.text('Desglose de Servicios por Categoría', m, y); y += 8;

        const hasIVA = _lastData.tablaDesglose && _lastData.tablaDesglose.length > 0 && _lastData.tablaDesglose[0].totalImporteBase != null;
        const head = hasIVA
          ? [['', 'Cant.', 'Total €', 'Base €', 'IVA €', '1/2. €', '% €', '% Cnt.']]
          : [['', 'Cant.', '€', '1/2. €', '% €', '% Cnt.']];

        let grandCant = 0, grandImporte = 0, grandBase = 0, grandIva = 0;
        if (_lastData.tablaDesglose) { for (const c of _lastData.tablaDesglose) { grandCant += c.totalCantidad; grandImporte += c.totalImporte; grandBase += c.totalImporteBase || 0; grandIva += c.totalImporteIva || 0; } }
        if (_lastData.productos && _lastData.productos.desglose) { for (const p of _lastData.productos.desglose) { grandCant += p.count; grandImporte += p.total; } }
        if (_lastData.externos && _lastData.externos.desglose) { for (const e of _lastData.externos.desglose) { grandCant += e.count; grandImporte += e.comision; } }

        const body = [];
        const catHeaderRows = [];
        const subtotalRows = [];

        // Servicios
        if (_lastData.tablaDesglose) {
          for (const cat of _lastData.tablaDesglose) {
            const catRow = hasIVA ? [cat.categoria, '', '', '', '', '', '', ''] : [cat.categoria, '', '', '', '', ''];
            catHeaderRows.push(body.length);
            body.push(catRow);

            for (const item of cat.items) {
              const pe = grandImporte > 0 ? item.importe / grandImporte * 100 : 0;
              const pc = grandCant > 0 ? item.cantidad / grandCant * 100 : 0;
              const row = ['  ' + item.nombre, String(item.cantidad), eur(item.importe)];
              if (hasIVA) row.push(item.importeBase ? eur(item.importeBase) : '', item.importeIva ? eur(item.importeIva) : '');
              row.push(eur(item.ticketMedio), pct(pe), pct(pc));
              body.push(row);
            }

            const catTicket = cat.totalCantidad > 0 ? cat.totalImporte / cat.totalCantidad : 0;
            const subRow = ['', String(cat.totalCantidad), eur(cat.totalImporte)];
            if (hasIVA) subRow.push(cat.totalImporteBase ? eur(cat.totalImporteBase) : '', cat.totalImporteIva ? eur(cat.totalImporteIva) : '');
            subRow.push(eur(catTicket), pct(grandImporte > 0 ? cat.totalImporte / grandImporte * 100 : 0), pct(grandCant > 0 ? cat.totalCantidad / grandCant * 100 : 0));
            subtotalRows.push(body.length);
            body.push(subRow);
          }
        }

        // Productos
        if (_lastData.productos && _lastData.productos.desglose && _lastData.productos.desglose.length > 0) {
          catHeaderRows.push(body.length);
          body.push(hasIVA ? ['PRODUCTOS', '', '', '', '', '', '', ''] : ['PRODUCTOS', '', '', '', '', '']);
          let pC = 0, pI = 0;
          for (const p of _lastData.productos.desglose) {
            const t = p.count > 0 ? p.total / p.count : 0;
            const row = ['  🛒 ' + p.nombre, String(p.count), eur(p.total)];
            if (hasIVA) row.push('', '');
            row.push(eur(t), pct(grandImporte > 0 ? p.total / grandImporte * 100 : 0), pct(grandCant > 0 ? p.count / grandCant * 100 : 0));
            body.push(row);
            pC += p.count; pI += p.total;
          }
          const pt = pC > 0 ? pI / pC : 0;
          subtotalRows.push(body.length);
          const sRow = ['', String(pC), eur(pI)];
          if (hasIVA) sRow.push('', '');
          sRow.push(eur(pt), pct(grandImporte > 0 ? pI / grandImporte * 100 : 0), pct(grandCant > 0 ? pC / grandCant * 100 : 0));
          body.push(sRow);
        }

        // Externos
        if (_lastData.externos && _lastData.externos.desglose && _lastData.externos.desglose.length > 0) {
          catHeaderRows.push(body.length);
          body.push(hasIVA ? ['COMISIONES EXTERNAS', '', '', '', '', '', '', ''] : ['COMISIONES EXTERNAS', '', '', '', '', '']);
          let eC = 0, eI = 0;
          for (const e of _lastData.externos.desglose) {
            const t = e.count > 0 ? e.comision / e.count : 0;
            const row = ['  🔗 ' + e.nombre, String(e.count), eur(e.comision)];
            if (hasIVA) row.push('', '');
            row.push(eur(t), pct(grandImporte > 0 ? e.comision / grandImporte * 100 : 0), pct(grandCant > 0 ? e.count / grandCant * 100 : 0));
            body.push(row);
            eC += e.count; eI += e.comision;
          }
          const et = eC > 0 ? eI / eC : 0;
          subtotalRows.push(body.length);
          const sRow = ['', String(eC), eur(eI)];
          if (hasIVA) sRow.push('', '');
          sRow.push(eur(et), pct(grandImporte > 0 ? eI / grandImporte * 100 : 0), pct(grandCant > 0 ? eC / grandCant * 100 : 0));
          body.push(sRow);
        }

        // Gran total
        const gt = grandCant > 0 ? grandImporte / grandCant : 0;
        const grandRow = ['TOTAL', String(grandCant), eur(grandImporte)];
        if (hasIVA) grandRow.push(eur(grandBase), eur(grandIva));
        grandRow.push(eur(gt), '', '');
        const grandTotalIdx = body.length;
        body.push(grandRow);

        doc.autoTable({
          startY: y, head, body, theme: 'striped',
          styles: { fontSize: 8, cellPadding: 2.5 },
          headStyles: headStyle,
          margin: { left: m, right: m },
          columnStyles: { 0: { halign: 'left', cellWidth: 55 } },
          didParseCell: (data) => {
            if (data.section !== 'body') return;
            const ri = data.row.index;
            if (catHeaderRows.includes(ri)) {
              data.cell.styles.fontStyle = 'bold'; data.cell.styles.fontSize = 9;
              data.cell.styles.fillColor = [44, 62, 80]; data.cell.styles.textColor = 255;
            }
            if (subtotalRows.includes(ri)) {
              data.cell.styles.fontStyle = 'bold';
              data.cell.styles.fillColor = [240, 230, 235]; data.cell.styles.textColor = [143, 28, 91];
            }
            if (ri === grandTotalIdx) {
              data.cell.styles.fontStyle = 'bold'; data.cell.styles.fontSize = 10;
              data.cell.styles.fillColor = [143, 28, 91]; data.cell.styles.textColor = 255;
            }
          }
        });
        y = doc.lastAutoTable.finalY + 12;
      }

      // ─────────────────────────────────────────────────────
      // DÍA DE LA SEMANA
      // ─────────────────────────────────────────────────────
      if (_lastData.porDiaSemana && _lastData.porDiaSemana.labels.length > 0) {
        checkPage(30);
        doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
        doc.text('Ingresos por Día de la Semana', m, y); y += 5;
        const totalDS = _lastData.porDiaSemana.valores.reduce((s, v) => s + v, 0);
        const body = _lastData.porDiaSemana.labels.map((l, i) => {
          const v = _lastData.porDiaSemana.valores[i];
          return [l, eur(v), pct(totalDS > 0 ? v / totalDS * 100 : 0)];
        });
        body.push(['Total', eur(totalDS), '']);
        doc.autoTable({
          startY: y, head: [['Día', 'Ingresos', '%']], body, theme: 'striped', styles: bodyStyle, headStyles: headStyle,
          margin: { left: m, right: m },
          columnStyles: { 0: { halign: 'left' }, 1: { halign: 'right' }, 2: { halign: 'right' } },
          didParseCell: (data) => { if (data.row.index === body.length - 1) { data.cell.styles.fontStyle = 'bold'; data.cell.styles.fillColor = [230, 230, 230]; } }
        });
        y = doc.lastAutoTable.finalY + 10;
      }

      // ─────────────────────────────────────────────────────
      // CLIENTES POR TIPO
      // ─────────────────────────────────────────────────────
      if (_lastData.clientesPorTipo && _lastData.clientesPorTipo.total > 0) {
        checkPage(30);
        doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
        doc.text('Clientes por Tipo', m, y); y += 5;
        const ct = _lastData.clientesPorTipo;
        const body = ct.tipos.map(t => [t.tipo, String(t.cantidad), pct(t.pct)]);
        body.push(['Total', String(ct.total), '']);
        doc.autoTable({
          startY: y, head: [['Tipo', 'Cantidad', '%']], body, theme: 'striped', styles: bodyStyle, headStyles: headStyle,
          margin: { left: m, right: m },
          columnStyles: { 0: { halign: 'left' }, 1: { halign: 'right' }, 2: { halign: 'right' } },
          didParseCell: (data) => { if (data.row.index === body.length - 1) { data.cell.styles.fontStyle = 'bold'; data.cell.styles.fillColor = [230, 230, 230]; } }
        });
        y = doc.lastAutoTable.finalY + 10;
      }

      // ─────────────────────────────────────────────────────
      // RATIO ST vs COMPLEMENTOS
      // ─────────────────────────────────────────────────────
      if (_lastData.ratioSTvsComplementos) {
        checkPage(40);
        const rst = _lastData.ratioSTvsComplementos;
        doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
        doc.text('Servicios Técnicos vs Complementos Asociados', m, y); y += 5;
        doc.autoTable({
          startY: y,
          body: [
            ['Ingresos Servicios Técnicos (principal)', eur(rst.ingresosST)],
            ['Ingresos complementos asociados a ST', eur(rst.ingresosComplementos)],
            ['Ratio complementos / ST', pct(rst.ratio)]
          ],
          theme: 'plain', styles: { fontSize: 10, cellPadding: 3 },
          margin: { left: m, right: m },
          columnStyles: { 0: { fontStyle: 'bold', halign: 'left', cellWidth: 100 }, 1: { halign: 'right' } }
        });
        y = doc.lastAutoTable.finalY + 4;

        if (rst.top5 && rst.top5.length > 0) {
          doc.autoTable({
            startY: y, head: [['Top 5 Complementos ST', 'Cant.', 'Importe']],
            body: rst.top5.map(c => [c.nombre, String(c.cantidad), eur(c.importe)]),
            theme: 'striped', styles: bodyStyle, headStyles: headStyle,
            margin: { left: m, right: m },
            columnStyles: { 0: { halign: 'left' }, 1: { halign: 'right' }, 2: { halign: 'right' } }
          });
          y = doc.lastAutoTable.finalY + 10;
        }
      }

      // ─────────────────────────────────────────────────────
      // PRODUCTIVIDAD POR EMPLEADO
      // ─────────────────────────────────────────────────────
      if (_lastData.productividadStaff && _lastData.productividadStaff.length > 0) {
        checkPage(30);
        doc.setFontSize(13); doc.setTextColor(44, 62, 80); doc.setFont(undefined, 'bold');
        doc.text('Productividad por Empleado', m, y); y += 5;
        doc.autoTable({
          startY: y,
          head: [['Empleado', 'Ingresos', 'Horas', 'Servicios', 'EUR/hora', 'Min/serv.']],
          body: _lastData.productividadStaff.map(ps => [ps.nombre, eur(ps.ingresos), ps.horas + 'h', String(ps.servicios), eur(ps.eurosPorHora), ps.minutosPorServicio + ' min']),
          theme: 'striped', styles: bodyStyle, headStyles: headStyle,
          margin: { left: m, right: m },
          columnStyles: { 0: { halign: 'left' }, 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } }
        });
        y = doc.lastAutoTable.finalY + 10;
      }

      // ─────────────────────────────────────────────────────
      // DESGLOSE FISCAL
      // ─────────────────────────────────────────────────────
      if (_lastData.totalImpuesto && _lastData.totalImpuesto > 0) {
        checkPage(30);
        doc.setFontSize(13); doc.setTextColor(107, 91, 149); doc.setFont(undefined, 'bold');
        doc.text(`Desglose Fiscal (IVA ${vr}%)`, m, y); y += 5;
        doc.autoTable({
          startY: y,
          body: [
            ['Total ventas (IVA incluido)', eur(totalVentas)],
            ['Base imponible', eur(_lastData.totalBaseImponible || 0)],
            [`Cuota IVA (${vr}%)`, eur(_lastData.totalImpuesto)],
            ...((_lastData.totalPropinas && _lastData.totalPropinas > 0) ? [['Propinas (sin IVA)', eur(_lastData.totalPropinas)]] : []),
            ['Recaudación total (ventas + propinas)', eur(_lastData.totalIngresos)]
          ],
          theme: 'grid', styles: { fontSize: 10, cellPadding: 4 },
          margin: { left: m, right: m },
          columnStyles: { 0: { fontStyle: 'bold', halign: 'left', cellWidth: 90 }, 1: { halign: 'right' } }
        });
        y = doc.lastAutoTable.finalY + 10;
      }

      // ─────────────────────────────────────────────────────
      // PIE DE PÁGINA
      // ─────────────────────────────────────────────────────
      const totalPaginas = doc.internal.getNumberOfPages();
      for (let i = 1; i <= totalPaginas; i++) {
        doc.setPage(i);
        doc.setFontSize(8); doc.setTextColor(128); doc.setFont(undefined, 'normal');
        doc.text(`Página ${i} de ${totalPaginas}`, m, ph - 10);
        doc.text(`Generado: ${new Date().toLocaleString('es-ES')}`, pw - m, ph - 10, { align: 'right' });
      }

      const compTag = _comparativaActivo ? '_COMP' : '';
      doc.save(`estadisticas_${fechaDesde}_${fechaHasta}${compTag}.pdf`);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EXPORTAR EXCEL — v2.5: incluye IVA donde aplica
    // ═══════════════════════════════════════════════════════════════════════

    function exportarExcel() {
      if (!_lastData || !_lastData.hayDatos) { alert('Primero carga los datos'); return; }

      const wb = XLSX.utils.book_new();
      const fechaDesde = document.getElementById('fechaDesde').value;
      const fechaHasta = document.getElementById('fechaHasta').value;
      const vr = _lastData.vatRate || 21;

      // Hoja 1: Resumen
      const resumenData = [
        ['Estadísticas Hair Times'],
        [`Período: ${fechaDesde} — ${fechaHasta}`],
      ];
      if (_comparativaActivo) resumenData.push([`Comparativa: ${_labelA} vs ${_labelB}`]);
      resumenData.push([]);
      const tv = _lastData.totalVentas != null ? _lastData.totalVentas : _lastData.totalIngresos;
      resumenData.push(['Total Ventas (sin propinas)', tv]);
      resumenData.push(['Transacciones', _lastData.totalTransacciones]);
      resumenData.push(['Ticket Medio', _lastData.totalTransacciones > 0 ? Math.round((tv / _lastData.totalTransacciones) * 100) / 100 : 0]);
      if (_lastData.totalPropinas && _lastData.totalPropinas > 0) {
        resumenData.push(['Propinas', _lastData.totalPropinas]);
        resumenData.push(['Recaudación total', _lastData.totalIngresos]);
      }
      // v2.5: IVA in resumen
      resumenData.push([]);
      resumenData.push([`DESGLOSE FISCAL (IVA ${vr}%)`]);
      resumenData.push(['Base imponible', _lastData.totalBaseImponible || 0]);
      resumenData.push([`Cuota IVA (${vr}%)`, _lastData.totalImpuesto || 0]);
      resumenData.push(['Total ventas (IVA incluido)', tv]);

      if (_lastData.granTotal) {
        resumenData.push([]);
        resumenData.push(['DESGLOSE GRAN TOTAL']);
        resumenData.push(['Ventas (sin propinas)', _lastData.granTotal.ventas || _lastData.granTotal.reservas]);
        if (_lastData.granTotal.propinas > 0) resumenData.push(['Propinas', _lastData.granTotal.propinas]);
        resumenData.push(['Comisión externos', _lastData.granTotal.comisionExternos]);
        resumenData.push(['Productos', _lastData.granTotal.productos]);
        resumenData.push(['TOTAL', _lastData.granTotal.total]);
      }
      const wsResumen = XLSX.utils.aoa_to_sheet(resumenData);
      wsResumen['!cols'] = [{ wch: 40 }, { wch: 15 }];
      XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen');

      // Hoja 2: Ingresos por Día — CON IVA
      const hasIngIVA = _lastData.ingresosPorDia.valoresBase;
      const ingHeaders = hasIngIVA ? ['Día', 'Total (€)', 'Base (€)', 'IVA (€)'] : ['Día', 'Ingresos (€)'];
      const ingData = [ingHeaders];
      let totalIng = 0, totalIngBase = 0, totalIngIva = 0;
      for (let i = 0; i < _lastData.ingresosPorDia.labels.length; i++) {
        const v = _lastData.ingresosPorDia.valores[i];
        const row = [_lastData.ingresosPorDia.labels[i], v];
        if (hasIngIVA) { row.push(_lastData.ingresosPorDia.valoresBase[i], _lastData.ingresosPorDia.valoresIva[i]); totalIngBase += _lastData.ingresosPorDia.valoresBase[i]; totalIngIva += _lastData.ingresosPorDia.valoresIva[i]; }
        ingData.push(row); totalIng += v;
      }
      const totalRow = ['TOTAL', totalIng];
      if (hasIngIVA) totalRow.push(totalIngBase, totalIngIva);
      ingData.push(totalRow);
      const wsIng = XLSX.utils.aoa_to_sheet(ingData);
      wsIng['!cols'] = [{ wch: 12 }, { wch: 15 }, { wch: 15 }, { wch: 15 }];
      XLSX.utils.book_append_sheet(wb, wsIng, 'Ingresos por Día');

      // Hoja 3-4: Método de Pago, Staff (sin IVA, sin cambios)
      const metData = [['Método', 'Importe (€)', '% del Total']];
      const totalMet = _lastData.porMetodoPago.valores.reduce((s, v) => s + v, 0);
      for (let i = 0; i < _lastData.porMetodoPago.labels.length; i++) { const v = _lastData.porMetodoPago.valores[i]; metData.push([_lastData.porMetodoPago.labels[i], v, totalMet > 0 ? Math.round((v / totalMet * 100) * 100) / 100 : 0]); }
      metData.push(['TOTAL', totalMet, 100]);
      const wsMet = XLSX.utils.aoa_to_sheet(metData); wsMet['!cols'] = [{ wch: 18 }, { wch: 15 }, { wch: 12 }]; XLSX.utils.book_append_sheet(wb, wsMet, 'Método de Pago');

      const staffData = [['Staff', 'Ingresos (€)', '% del Total']];
      const totalSt = _lastData.porStaff.valores.reduce((s, v) => s + v, 0);
      for (let i = 0; i < _lastData.porStaff.labels.length; i++) { const v = _lastData.porStaff.valores[i]; staffData.push([_lastData.porStaff.labels[i], v, totalSt > 0 ? Math.round((v / totalSt * 100) * 100) / 100 : 0]); }
      staffData.push(['TOTAL', totalSt, 100]);
      const wsStaff = XLSX.utils.aoa_to_sheet(staffData); wsStaff['!cols'] = [{ wch: 18 }, { wch: 15 }, { wch: 12 }]; XLSX.utils.book_append_sheet(wb, wsStaff, 'Por Staff');

      // Hoja 5: Top Servicios — CON IVA
      const hasSvcIVA = _lastData.porServicio.valoresBase;
      const svcHeaders = hasSvcIVA ? ['Servicio', 'Total (€)', 'Base (€)', 'IVA (€)', '% del Total'] : ['Servicio', 'Ingresos (€)', '% del Total'];
      const svcData = [svcHeaders];
      const totalSvc = _lastData.porServicio.valores.reduce((s, v) => s + v, 0);
      for (let i = 0; i < _lastData.porServicio.labels.length; i++) {
        const v = _lastData.porServicio.valores[i]; const p = totalSvc > 0 ? Math.round((v / totalSvc * 100) * 100) / 100 : 0;
        const row = [_lastData.porServicio.labels[i], v];
        if (hasSvcIVA) row.push(_lastData.porServicio.valoresBase[i], _lastData.porServicio.valoresIva[i]);
        row.push(p); svcData.push(row);
      }
      svcData.push(['TOTAL (Top 10)', totalSvc]);
      const wsSvc = XLSX.utils.aoa_to_sheet(svcData); wsSvc['!cols'] = [{ wch: 35 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 12 }]; XLSX.utils.book_append_sheet(wb, wsSvc, 'Top Servicios');

      // Hoja 6: Desglose por Categoría — CON IVA
      const hasDesIVA = _lastData.tablaDesglose && _lastData.tablaDesglose.length > 0 && _lastData.tablaDesglose[0].totalImporteBase != null;
      const desData = [
        ['Desglose de Servicios por Categoría'],
        [`Período: ${fechaDesde} — ${fechaHasta}`],
      ];
      desData.push([]);
      const desHeaders = hasDesIVA ? ['Categoría / Servicio', 'Cant.', 'Total €', 'Base €', 'IVA €', '1/2. €', '% de €', '% Cant.'] : ['Categoría / Servicio', 'Cant.', '€', '1/2. €', '% de €', '% Cant.'];
      desData.push(desHeaders);

      let grandCant = 0, grandImporte = 0;
      if (_lastData.tablaDesglose) { for (const cat of _lastData.tablaDesglose) { grandCant += cat.totalCantidad; grandImporte += cat.totalImporte; } }
      if (_lastData.productos && _lastData.productos.desglose) { for (const p of _lastData.productos.desglose) { grandCant += p.count; grandImporte += p.total; } }
      if (_lastData.externos && _lastData.externos.desglose) { for (const e of _lastData.externos.desglose) { grandCant += e.count; grandImporte += e.comision; } }

      if (_lastData.tablaDesglose) {
        for (const cat of _lastData.tablaDesglose) {
          desData.push([cat.categoria]);
          for (const item of cat.items) {
            const pe = grandImporte > 0 ? Math.round((item.importe / grandImporte * 100) * 100) / 100 : 0;
            const pc = grandCant > 0 ? Math.round((item.cantidad / grandCant * 100) * 100) / 100 : 0;
            const row = ['  ' + item.nombre, item.cantidad, item.importe];
            if (hasDesIVA) row.push(item.importeBase || 0, item.importeIva || 0);
            row.push(item.ticketMedio, pe, pc);
            desData.push(row);
          }
          const catTicket = cat.totalCantidad > 0 ? Math.round((cat.totalImporte / cat.totalCantidad) * 100) / 100 : 0;
          const catPe = grandImporte > 0 ? Math.round((cat.totalImporte / grandImporte * 100) * 100) / 100 : 0;
          const catPc = grandCant > 0 ? Math.round((cat.totalCantidad / grandCant * 100) * 100) / 100 : 0;
          const subRow = ['  SUBTOTAL', cat.totalCantidad, cat.totalImporte];
          if (hasDesIVA) subRow.push(cat.totalImporteBase || 0, cat.totalImporteIva || 0);
          subRow.push(catTicket, catPe, catPc);
          desData.push(subRow);
        }
      }

      const grandTicket = grandCant > 0 ? Math.round((grandImporte / grandCant) * 100) / 100 : 0;
      desData.push([]);
      desData.push(['TOTAL DE TODAS LAS CATEGORÍAS', grandCant, grandImporte]);

      const wsDes = XLSX.utils.aoa_to_sheet(desData);
      wsDes['!cols'] = [{ wch: 38 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 10 }];
      XLSX.utils.book_append_sheet(wb, wsDes, 'Desglose por Categoría');

      // Hojas 7-10: sin cambios (Día Semana, ST vs Complementos, Clientes, Productividad)
      if (_lastData.porDiaSemana && _lastData.porDiaSemana.labels.length > 0) {
        const dsData = [['Día de la Semana', 'Ingresos (€)', '% del Total']];
        const totalDS = _lastData.porDiaSemana.valores.reduce((s, v) => s + v, 0);
        for (let i = 0; i < _lastData.porDiaSemana.labels.length; i++) { const v = _lastData.porDiaSemana.valores[i]; dsData.push([_lastData.porDiaSemana.labels[i], v, totalDS > 0 ? Math.round((v / totalDS * 100) * 100) / 100 : 0]); }
        dsData.push(['TOTAL', totalDS, 100]);
        const wsDS = XLSX.utils.aoa_to_sheet(dsData); wsDS['!cols'] = [{ wch: 15 }, { wch: 15 }, { wch: 12 }]; XLSX.utils.book_append_sheet(wb, wsDS, 'Dia Semana');
      }

      if (_lastData.ratioSTvsComplementos) {
        const rst = _lastData.ratioSTvsComplementos;
        const rstData = [['Servicios Tecnicos vs Complementos'], [], ['Ingresos ST', rst.ingresosST], ['Ingresos complementos', rst.ingresosComplementos], ['Ratio', rst.ratio + '%'], [], ['Top 5 Complementos', 'Cant.', 'Importe']];
        if (rst.top5) { for (const c of rst.top5) rstData.push([c.nombre, c.cantidad, c.importe]); }
        const wsRST = XLSX.utils.aoa_to_sheet(rstData); wsRST['!cols'] = [{ wch: 35 }, { wch: 12 }, { wch: 12 }]; XLSX.utils.book_append_sheet(wb, wsRST, 'ST vs Complementos');
      }

      if (_lastData.clientesPorTipo && _lastData.clientesPorTipo.total > 0) {
        const ct = _lastData.clientesPorTipo;
        const ctData = [['Tipo', 'Cantidad', '%']];
        for (const t of ct.tipos) ctData.push([t.tipo, t.cantidad, t.pct]);
        ctData.push(['TOTAL', ct.total, 100]);
        const wsCT = XLSX.utils.aoa_to_sheet(ctData); wsCT['!cols'] = [{ wch: 18 }, { wch: 10 }, { wch: 10 }]; XLSX.utils.book_append_sheet(wb, wsCT, 'Clientes por Tipo');
      }

      if (_lastData.productividadStaff && _lastData.productividadStaff.length > 0) {
        const prodData = [['Empleado', 'Ingresos (€)', 'Horas', 'Servicios', 'EUR/hora', 'Min/servicio']];
        for (const ps of _lastData.productividadStaff) prodData.push([ps.nombre, ps.ingresos, ps.horas, ps.servicios, ps.eurosPorHora, ps.minutosPorServicio]);
        const wsProd = XLSX.utils.aoa_to_sheet(prodData); wsProd['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 8 }, { wch: 10 }, { wch: 12 }, { wch: 14 }]; XLSX.utils.book_append_sheet(wb, wsProd, 'Productividad');
      }

      const compTag = _comparativaActivo ? '_COMP' : '';
      XLSX.writeFile(wb, `estadisticas_${fechaDesde}_${fechaHasta}${compTag}.xlsx`);
    }
  </script>
</body>
</html>
