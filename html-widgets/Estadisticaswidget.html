<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas Hair Times</title>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════════
       ESTADÍSTICAS KAMISUITE v2.6.2 — Light theme
       ═════════════════════════════════════════════════════
       v2.6.2 (12 ago 2026): MEDIOS DE PAGO EN DOS VISTAS + CANJES.
         - El gráfico "Por Método de Pago" pasa a titularse "Importes
           reales por canal": desde el backend v2.6.1 los mixtos ya van
           repartidos, y el título anterior no lo decía.
         - Bloque nuevo "🔢 Cobros por botón pulsado": tabla con número
           de pulsaciones e importe por botón (Tarjeta / Efectivo /
           Bizum / Mixto / Canje). Vista de auditoría: aquí 'Mixto' SÍ
           es una fila propia porque fue UN botón. Requiere backend
           estadisticas.web.js v2.6.3 (`porBotonPago`, `botonTotales`);
           con un backend anterior el bloque avisa de que no hay datos
           y el resto de la pantalla sigue igual.
         - Recuadro nuevo de CANJES DE BONO (número y valor de tarifa
           consumido, de `canjesBono`). Va aparte de los medios de pago
           a propósito: un canje no es caja nueva. Solo se pinta si el
           backend lo marca disponible y hay al menos un canje.
         - Pie explicativo bajo cada una de las dos tablas, para que
           nadie lea una diferencia por canal como un descuadre.
         - NO se toca: layout, paleta, tipografía, resto de gráficas,
           comparativa, presets, KPIs, ni la exportación a PDF/Excel.
       ═════════════════════════════════════════════════════
       v2.6.1 (12 ago 2026): EWCM ELIMINADO.
         - Retirado por completo el interruptor "Export Without Cash
           Mode", que generaba el informe en pantalla, el PDF y el Excel
           ocultando los cobros en efectivo.
         - Motivo: incompatible con la obligación Verifactu (enero
           2027), cuyo principio es el registro íntegro e inalterable de
           TODAS las operaciones.
         - Qué desaparece: bloque CSS .ewcm-*, el control del toolbar,
           el estado _ewcmActivo y su listener, la función ewcmSuffix()
           y sus 5 puntos de uso (títulos de las 4 gráficas + línea de
           periodo), la marca "Modo EWCM" en PDF y Excel, el sufijo del
           pie del PDF y el tag _EWCM del nombre de los ficheros
           exportados.
         - Ya no se envía `excludeEfectivo` en los postMessage 'load'
           ni 'loadComparativa'.
         - Cadena completa: widget v2.6.1 + page code v2.6 +
           estadisticas.web.js v2.6.2.
         - NO se toca nada más: layout, paleta, tipografía, gráficas,
           comparativa, presets, KPIs, tablas ni el resto de la
           exportación.
       ═══════════════════════════════════════════════════════
       v2.6.0: Selector de orden en la tabla "Ingresos por Día"
         - La tabla usaba SIEMPRE ingresosPorDiaRanking (orden por
           importe descendente). Ahora por defecto va en orden
           CRONOLÓGICO (ingresosPorDia) y se puede alternar con dos
           botones: Día / Importe.
         - El gráfico no cambia: siempre cronológico.
         - La exportación a PDF respeta el orden elegido en pantalla.
         - Días sin cobros: se muestran a 0€ y la columna "vs Media"
           queda con guión (no tiene sentido un -100% en día cerrado).
         - Sin cambios en CSS, colores ni layout: los botones usan
           estilos en línea con las variables ya existentes.
       ═══════════════════════════════════════════════════════ */
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface2: #f0f1f3;
      --surface3: #e8e9ec;
      --border: rgba(0,0,0,.10);
      --border-hover: rgba(0,0,0,.20);
      --text: #1a1b1e;
      --text-secondary: rgba(0,0,0,.60);
      --muted: rgba(0,0,0,.40);
      --accent: #c9a44a;
      --accent-dim: rgba(201,164,74,.12);
      --cash: #8F1C5B;
      --card: #4D8F8C;
      --bizum: #D18C49;
      --paid: #2a9d54;
      --radius: 10px;
      --radius-sm: 6px;
      --delta-up: #2a9d54;
      --delta-down: #d32f2f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Bai Jamjuree', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      padding: 20px;
      color: var(--text);
    }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
    }
    .header h1 { font-size: 24px; color: var(--text); font-weight: 700; }

    .filtros { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .filtros label { font-size: 14px; color: var(--text-secondary); font-weight: 600; }
    .filtros input[type="date"] {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; font-family: inherit; background: var(--surface2); color: var(--text); outline: none;
      transition: border-color .2s;
    }
    .filtros input[type="date"]:focus { border-color: var(--accent); }
    .filtros button {
      padding: 8px 16px; background: linear-gradient(135deg, #3a7ca5, #2c5f7c);
      color: white; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-weight: 600; transition: transform 0.2s; font-family: inherit; font-size: 14px;
    }
    .filtros button:hover { transform: scale(1.02); }
    .filtros .btn-export { background: linear-gradient(135deg, #8F1C5B, #6B1543); }
    .filtros .btn-comparar { background: linear-gradient(135deg, #6B5B95, #4A3D6E); }
    .filtros .btn-comparar.active { background: linear-gradient(135deg, #c9a44a, #a88a3a); }

    /* v2.6.1: bloque .ewcm-* ELIMINADO junto con el interruptor EWCM.
       Ninguna otra regla del widget usaba estas clases. */

    /* ═══════════════════════════════════════════════════════
       v2.5: Panel Comparar
       ═══════════════════════════════════════════════════════ */
    .panel-comparar {
      display: none; margin-bottom: 20px; padding: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .panel-comparar.visible { display: block; }
    .panel-comparar h4 { font-size: 14px; color: var(--text); margin-bottom: 12px; }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .presets button {
      padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface2); color: var(--text-secondary); cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 600; transition: all .2s;
    }
    .presets button:hover { border-color: var(--accent); color: var(--accent); }
    .presets button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .custom-dates {
      display: none; gap: 10px; align-items: center; flex-wrap: wrap;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .custom-dates.visible { display: flex; }
    .custom-dates label { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
    .custom-dates input[type="date"] {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-family: inherit; background: var(--surface2); color: var(--text);
    }
    .custom-dates button {
      padding: 6px 14px; background: linear-gradient(135deg, #6B5B95, #4A3D6E);
      color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer;
      font-family: inherit; font-weight: 600; font-size: 13px;
    }
    .comparativa-info {
      display: none; padding: 8px 14px; background: rgba(107,91,149,.08);
      border: 1px solid rgba(107,91,149,.2); border-radius: var(--radius-sm);
      font-size: 13px; color: #6B5B95; font-weight: 600; margin-bottom: 16px;
    }
    .comparativa-info.visible { display: flex; align-items: center; justify-content: space-between; }
    .comparativa-info .cerrar-comp {
      background: none; border: none; color: #6B5B95; cursor: pointer;
      font-size: 16px; font-weight: 700; padding: 0 4px;
    }

    /* ═══════════════════════════════════════════════════════
       KPI Cards + Delta indicators
       ═══════════════════════════════════════════════════════ */
    .resumen { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
    .resumen-card {
      flex: 1; min-width: 150px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); text-align: center;
    }
    .resumen-card .valor { font-size: 28px; font-weight: 700; color: var(--text); }
    .resumen-card .etiqueta { font-size: 13px; color: var(--muted); margin-top: 5px; }
    .resumen-card .delta {
      display: none; font-size: 12px; font-weight: 600; margin-top: 6px;
    }
    .resumen-card .delta.visible { display: block; }
    .resumen-card .delta.up { color: var(--delta-up); }
    .resumen-card .delta.down { color: var(--delta-down); }
    .resumen-card .delta .prev-val { font-size: 11px; color: var(--muted); font-weight: 400; }

    .grid-graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
    .grafico-container {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .grafico-container h3 { font-size: 16px; color: var(--text); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
    .grafico-wrapper { position: relative; height: 280px; }
    /* v2.5.1: comparativa — pares lado a lado */
    .compar-pair { display: flex; gap: 16px; }
    .compar-pair > div { flex: 1; min-width: 0; }
    .compar-pair > div + div { border-left: 1px solid var(--border); padding-left: 16px; }
    .compar-pair .grafico-wrapper { height: 240px; }
    .compar-pair h4 { font-size: 12px; margin-bottom: 8px; text-align: center; }
    @media (max-width: 768px) { .compar-pair { flex-direction: column; } .compar-pair > div + div { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 16px; } }

    .no-datos { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 18px; }
    .loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .loading::after {
      content: ''; display: inline-block; width: 20px; height: 20px;
      border: 3px solid var(--border); border-top-color: #3a7ca5; border-radius: 50%;
      animation: spin 1s linear infinite; margin-left: 10px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════════════════
       TABLA DESGLOSE POR CATEGORÍA
       ═══════════════════════════════════════════════════════ */
    .tabla-desglose-container {
      margin-top: 25px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
      overflow-x: auto;
    }
    .tabla-desglose-container h3 {
      font-size: 18px; color: var(--text); margin-bottom: 16px;
      padding-bottom: 10px; border-bottom: 2px solid var(--border);
    }
    .tabla-desglose { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tabla-desglose th {
      text-align: right; padding: 8px 10px; color: var(--muted); font-weight: 600;
      border-bottom: 2px solid var(--border); font-size: 12px; white-space: nowrap;
    }
    .tabla-desglose th:first-child { text-align: left; }
    .tabla-desglose td { padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tabla-desglose td:first-child { text-align: left; white-space: normal; }

    .tabla-desglose .cat-header td {
      font-weight: 700; color: var(--text); font-size: 13px;
      padding-top: 14px; padding-bottom: 6px; border-bottom: none;
    }
    .tabla-desglose .svc-row td { padding-left: 20px; color: var(--text-secondary); font-size: 12px; }
    .tabla-desglose .svc-row td:first-child { color: var(--text-secondary); }
    .tabla-desglose .cat-subtotal td {
      font-weight: 700; color: #8F1C5B; font-size: 12px;
      border-bottom: 2px solid var(--border); padding-top: 4px; padding-bottom: 8px;
    }
    .tabla-desglose .grand-total td {
      font-weight: 700; color: #8F1C5B; font-size: 14px;
      border-top: 3px solid #8F1C5B; padding-top: 12px; padding-bottom: 12px;
    }

    .chart-data-table {
      margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 12px;
      overflow-x: auto;
    }
    .chart-data-table table { width: 100%; border-collapse: collapse; }
    .chart-data-table th {
      text-align: right; font-weight: 600; color: var(--muted); font-size: 11px;
      padding: 3px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .chart-data-table th:first-child { text-align: left; }
    .chart-data-table td { padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
    .chart-data-table td:first-child { text-align: left; color: var(--text-secondary); font-weight: 500; white-space: normal; }
    .chart-data-table .total-row td { font-weight: 700; color: var(--text); border-top: 2px solid var(--border); }

    /* IVA columns styling */
    .col-base { color: var(--text-secondary); }
    .col-iva { color: #6B5B95; font-style: italic; }

    .tabla-desglose .cat-header.extras td { color: #D18C49; }
    .tabla-desglose .cat-subtotal.extras td { color: #D18C49; border-bottom-color: rgba(209,140,73,.3); }
    .tabla-desglose .cat-header.productos td { color: #4D8F8C; }
    .tabla-desglose .cat-subtotal.productos td { color: #4D8F8C; border-bottom-color: rgba(77,143,140,.3); }
    .tabla-desglose .cat-header.externos td { color: #6B5B95; }
    .tabla-desglose .cat-subtotal.externos td { color: #6B5B95; border-bottom-color: rgba(107,91,149,.3); }

    .tabla-desglose .subgrupo-header td {
      font-weight: 600; font-size: 11px; color: var(--muted); font-style: italic;
      padding-top: 8px; padding-bottom: 4px; padding-left: 16px;
      border-bottom: 1px dashed var(--border);
    }
    .tabla-periodo { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

    @media (max-width: 600px) {
      .grid-graficos { grid-template-columns: 1fr; }
      .grafico-wrapper { height: 250px; }
      .header h1 { font-size: 20px; }
      .tabla-desglose { font-size: 11px; }
      .tabla-desglose th, .tabla-desglose td { padding: 4px 6px; }
      .resumen-card .valor { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 Estadísticas y Análisis</h1>
    <div class="filtros">
      <label>Desde:</label>
      <input type="date" id="fechaDesde">
      <label>Hasta:</label>
      <input type="date" id="fechaHasta">
      <button id="btnFiltrar">Aplicar</button>
      <button id="btnComparar" class="btn-comparar">📊 Comparar</button>
      <button id="btnExportarPdf" class="btn-export">📄 Exportar PDF</button>
      <button id="btnExportarExcel" class="btn-export" style="background:linear-gradient(135deg,#1D6F42,#155C35);">📊 Exportar Excel</button>
    </div>
  </div>

  <!-- v2.5: Panel comparar -->
  <div class="panel-comparar" id="panelComparar">
    <h4>Comparar con periodo anterior</h4>
    <div class="presets" id="presetButtons">
      <button data-preset="anio">Año</button>
      <button data-preset="trimestre">Trimestre</button>
      <button data-preset="mes">Mes (interanual)</button>
      <button data-preset="mesAnterior">Mes anterior</button>
      <button data-preset="semana">Semana anterior</button>
      <button data-preset="diaSemana">Día de semana</button>
      <button data-preset="custom">Custom</button>
    </div>
    <div class="custom-dates" id="customDates">
      <label>Periodo A — Desde:</label>
      <input type="date" id="fechaDesdeA2">
      <label>Hasta:</label>
      <input type="date" id="fechaHastaA2">
      <span style="color:var(--muted);font-weight:700;font-size:16px;padding:0 6px;">VS</span>
      <label>Periodo B — Desde:</label>
      <input type="date" id="fechaDesdeB">
      <label>Hasta:</label>
      <input type="date" id="fechaHastaB">
      <button id="btnAplicarCustom">Aplicar</button>
    </div>
  </div>

  <div class="comparativa-info" id="comparativaInfo">
    <span id="comparativaLabel"></span>
    <button class="cerrar-comp" id="btnCerrarComp" title="Cerrar comparativa">✕</button>
  </div>

  <!-- v2.5.1: Banner análisis Día de Semana -->
  <div id="diaSemanaBanner" style="display:none; margin-bottom:20px; padding:20px; background:linear-gradient(135deg,#fdf6e3,#f9eccc); border:2px solid var(--accent); border-radius:var(--radius); box-shadow:0 2px 8px rgba(201,164,74,0.2);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="color:#8a6d2f; margin:0; font-size:16px;">Análisis por Día de la Semana</h3>
      <button id="btnCerrarDS" style="background:none; border:none; color:#8a6d2f; cursor:pointer; font-size:18px; font-weight:700;">✕</button>
    </div>
    <div id="diaSemanaBannerContent"></div>
  </div>

  <!-- v2.5: 4 KPI cards (added Impuesto) -->
  <div class="resumen" id="resumen">
    <div class="resumen-card">
      <div class="valor" id="totalIngresos">-</div>
      <div class="etiqueta">Total Ventas</div>
      <div class="delta" id="deltaIngresos"></div>
    </div>
    <div class="resumen-card">
      <div class="valor" id="totalTransacciones">-</div>
      <div class="etiqueta">Transacciones</div>
      <div class="delta" id="deltaTransacciones"></div>
    </div>
    <div class="resumen-card">
      <div class="valor" id="promedioTicket">-</div>
      <div class="etiqueta">Ticket Medio</div>
      <div class="delta" id="deltaTicket"></div>
    </div>
    <div class="resumen-card">
      <div class="valor" id="totalImpuesto">-</div>
      <div class="etiqueta" id="etiquetaImpuesto">Impuesto</div>
      <div class="delta" id="deltaImpuesto"></div>
    </div>
  </div>

  <div class="grid-graficos" id="graficos">
    <div class="loading">Cargando estadísticas</div>
  </div>

  <div class="tabla-desglose-container" id="tablaContainer" style="display:none;">
    <h3>Desglose de Servicios por Categoria</h3>
    <div class="tabla-periodo" id="tablaPeriodo"></div>
    <table class="tabla-desglose" id="tablaDesglose"></table>
  </div>

  <div class="tabla-desglose-container" id="seccionNuevas" style="display:none;">
    <div id="diaSemanaSection"></div>
    <div id="clientesSection" style="margin-top:20px;"></div>
    <div id="ratioSTSection" style="margin-top:20px;"></div>
    <div id="productividadSection" style="margin-top:20px;"></div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // VARIABLES GLOBALES
    // ═══════════════════════════════════════════════════════════════════════

    const WIDGET_VERSION = '2.6.2';

    let chartIngresos = null;
    let chartMetodo = null;
    let chartStaff = null;
    let chartServicios = null;
    let _lastData = null;
    // v2.5: Comparativa
    let _comparativaActivo = false;
    let _periodoAData = null;
    let _periodoBData = null;
    let _labelA = '';
    let _labelB = '';
    let _scrollToDiaSemana = false; // unused, kept for safety
    // v2.5.1: Fechas originales antes de aplicar preset (para restaurar al cerrar)
    let _fechasOriginales = null;
    // v2.6.0: Orden de la tabla "Ingresos por Día" — 'dia' (cronológico) | 'importe'
    let _ordenIngresosDia = 'dia';

    const COLORES = {
      primario: '#3a7ca5',
      secundario: '#2c5f7c',
      efectivo: '#8F1C5B',
      tarjeta: '#4D8F8C',
      bizum: '#D18C49',
      comparB: 'rgba(107,91,149,0.5)',
      gradiente: ['#3a7ca5', '#4D8F8C', '#8F1C5B', '#D18C49', '#6B5B95', '#88B04B', '#F7CAC9', '#92A8D1']
    };

    // ═══════════════════════════════════════════════════════════════════════
    // INICIALIZACIÓN
    // ═══════════════════════════════════════════════════════════════════════

    document.addEventListener('DOMContentLoaded', () => {
      console.log('[Stats widget v' + WIDGET_VERSION + '] listo');

      const hoy = new Date();
      const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
      const ultimoDia = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);

      document.getElementById('fechaDesde').value = toISODate(primerDia);
      document.getElementById('fechaHasta').value = toISODate(ultimoDia);

      document.getElementById('btnFiltrar').addEventListener('click', () => { cerrarComparativa(); requestStats(); });
      document.getElementById('btnExportarPdf').addEventListener('click', () => exportarPdfConGraficos());
      document.getElementById('btnExportarExcel').addEventListener('click', () => exportarExcel());

      // v2.5: Comparar
      document.getElementById('btnComparar').addEventListener('click', togglePanelComparar);
      document.getElementById('btnCerrarComp').addEventListener('click', cerrarComparativa);
      document.getElementById('btnAplicarCustom').addEventListener('click', aplicarCustom);
      document.getElementById('btnCerrarDS').addEventListener('click', () => {
        ocultarAnalisisDiaSemana();
        document.querySelectorAll('#presetButtons button').forEach(b => b.classList.remove('active'));
      });

      document.querySelectorAll('#presetButtons button').forEach(btn => {
        btn.addEventListener('click', () => {
          const preset = btn.dataset.preset;
          document.querySelectorAll('#presetButtons button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (preset === 'custom') {
            ocultarAnalisisDiaSemana();
            document.getElementById('customDates').classList.add('visible');
            // Pre-rellenar custom con fechas actuales
            document.getElementById('fechaDesdeA2').value = document.getElementById('fechaDesde').value;
            document.getElementById('fechaHastaA2').value = document.getElementById('fechaHasta').value;
          } else if (preset === 'diaSemana') {
            document.getElementById('customDates').classList.remove('visible');
            // Pedir media día semana del año al backend
            document.getElementById('diaSemanaBanner').style.display = 'block';
            document.getElementById('diaSemanaBannerContent').innerHTML = '<div class="loading">Calculando medias del año</div>';
            window.parent.postMessage({ type: 'loadDiaSemanaAnio' }, '*');
          } else {
            ocultarAnalisisDiaSemana();
            document.getElementById('customDates').classList.remove('visible');
            // Guardar fechas originales antes de cambiar (solo si no las hemos guardado ya)
            if (!_fechasOriginales) {
              _fechasOriginales = {
                desde: document.getElementById('fechaDesde').value,
                hasta: document.getElementById('fechaHasta').value
              };
            }
            const periodos = calcularPeriodos(preset);
            if (periodos) {
              document.getElementById('fechaDesde').value = periodos.a.fechaDesde;
              document.getElementById('fechaHasta').value = periodos.a.fechaHasta;
              requestComparativa(periodos.b, periodos.a.label + ' vs ' + periodos.b.label);
            }
          }
        });
      });

      window.parent.postMessage({ type: 'ready' }, '*');
    });

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'stats') { _comparativaActivo = false; renderStats(msg.payload); }
      if (msg.type === 'comparativa') renderComparativa(msg);
      if (msg.type === 'diaSemanaAnio') renderDiaSemanaAnio(msg.payload);
      if (msg.type === 'loading') { document.getElementById('graficos').innerHTML = '<div class="loading">' + (msg.message || 'Cargando') + '</div>'; }
      if (msg.type === 'error') showError(msg.message);
    });

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════════════

    function requestStats() {
      const fechaDesde = document.getElementById('fechaDesde').value;
      const fechaHasta = document.getElementById('fechaHasta').value;
      document.getElementById('graficos').innerHTML = '<div class="loading">Cargando estadísticas</div>';
      document.getElementById('tablaContainer').style.display = 'none';
      document.getElementById('seccionNuevas').style.display = 'none';
      hideComparativaInfo();
      window.parent.postMessage({ type: 'load', fechaDesde, fechaHasta }, '*');
    }

    function eur(n) { return (Math.round(Number(n || 0) * 100) / 100).toFixed(2).replace('.', ',') + '€'; }
    function pct(n) { return (Math.round(Number(n || 0) * 100) / 100).toFixed(2).replace('.', ',') + '%'; }
    function toISODate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // v2.5: Delta helpers
    function calcDelta(actual, anterior) {
      if (!anterior || anterior === 0) return { abs: actual, pct: 0, dir: 'up' };
      const diff = actual - anterior;
      const p = Math.round((diff / Math.abs(anterior)) * 10000) / 100;
      return { abs: Math.round(diff * 100) / 100, pct: p, dir: diff >= 0 ? 'up' : 'down' };
    }

    function renderDelta(elId, actual, anterior, formatFn) {
      const el = document.getElementById(elId);
      if (!el || !_comparativaActivo || anterior == null) { if (el) { el.classList.remove('visible'); } return; }
      const d = calcDelta(actual, anterior);
      const arrow = d.dir === 'up' ? '▲' : '▼';
      const sign = d.abs >= 0 ? '+' : '';
      el.className = 'delta visible ' + d.dir;
      el.innerHTML = `${arrow} ${sign}${formatFn ? formatFn(d.abs) : d.abs} (${sign}${d.pct}%) <span class="prev-val">ant: ${formatFn ? formatFn(anterior) : anterior}</span>`;
    }

    // ═══════════════════════════════════════════════════════════════════════

    // v2.5: Render — HOY vs media del año + análisis del periodo cargado
    function renderDiaSemanaAnio(data) {

      document.getElementById('diaSemanaBannerContent').innerHTML = html;
